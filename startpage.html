<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>Glass Start</title>
    <!-- 页面预检：若上次在导航页，给 <html> 加 .nr 隐藏首屏，避免刷新后闪烁 -->
    <script>try{sessionStorage.getItem('startpage_section')==='nav'&&document.documentElement.classList.add('nr')}catch(e){}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* .nr 模式：隐藏起始页、显示导航页，与上方 inline script 配合防止闪烁 */
        .nr section:first-of-type { display: none; }
        .nr #navSection { visibility: visible; }
        /* ===== 布局 & 基础 ===== */
        :root {
            --glass-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.15);
            --radius: 1.5rem;
            --blur: 24px;
        }
        body { font-family: 'Nunito', sans-serif; scrollbar-width:none; -ms-overflow-style:none; 
               overflow:hidden; }
        body::-webkit-scrollbar { display:none; }
        * { scrollbar-width:none; -ms-overflow-style:none; }
        *::-webkit-scrollbar { display:none; }
        .apple-radius { border-radius: var(--radius); }
        /* ===== 玻璃效果 ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            will-change: backdrop-filter;
        }
        .glass-strong {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            will-change: backdrop-filter;
        }
        /* ===== 组件 ===== */
        .search-input::placeholder { color: rgba(255,255,255,0.6); }
        .fade-in { animation: fadeIn 0.8s ease-out backwards; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .dropdown-menu { opacity:0; transform:translateY(-10px); pointer-events:none; transition:all 0.2s ease; }
        .dropdown-menu.active { opacity:1; transform:translateY(0); pointer-events:auto; }
        .clock-text { text-shadow: 0 2px 20px rgba(0,0,0,0.4), 0 0 60px rgba(0,0,0,0.2); }
        .bookmark-item { transition: all 0.2s ease; }
        .bookmark-item:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
        .nav-bookmark { transition: all 0.15s ease; }
        .nav-bookmark:hover { background: rgba(255,255,255,0.1); }
        .nav-hidden { visibility:hidden; }
        .nav-visible { visibility:visible; }
        .nav-hidden .glass { opacity:0; }
        .nav-visible .glass { animation:navFadeIn 0.6s ease forwards; }
        @keyframes navFadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .sidebar-item {
            transition: all 0.15s ease;
            border-left: 2px solid transparent;
        }
        .sidebar-item:hover { background: rgba(255,255,255,0.08); }
        .sidebar-item.active {
            background: rgba(255,255,255,0.12);
            border-left-color: rgba(255,255,255,0.6);
            color: #fff;
        }
        .scroll-hint { animation: bounceDown 2s ease-in-out infinite; }
        @keyframes bounceDown { 0%,100%{transform:translateY(0);opacity:0.6} 50%{transform:translateY(8px);opacity:1} }
        .hint-down { animation:hintFade 7s ease forwards; }
        .hint-up { animation:hintFade 6s ease 1s forwards; }
        @keyframes hintFade { 0%,55%{opacity:1} 100%{opacity:0;pointer-events:none} }
        .section-divider { background: linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent); }
        .edit-overlay { opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
        .edit-overlay.active { opacity:1; pointer-events:auto; }
        .edit-overlay > div { transform:scale(0.95); transition:transform 0.2s ease; }
        .edit-overlay.active > div { transform:scale(1); }
        .edit-overlay .glass-strong { background: rgba(255,255,255,0.2); }
        .drag-over { background: rgba(255,255,255,0.12); }
        [draggable="true"] { cursor: grab; }
        [draggable="true"]:active { cursor: grabbing; }
    </style>
</head>

        let pageData = { bookmarks: DEFAULT_BOOKMARKS, categories: DEFAULT_CATEGORIES };

        const engines = {

        const backgrounds = [
            'https://images.unsplash.com/photo-1477346611705-65d1883cee1e?q=80&w=2070&auto=format&fit=crop',

            'https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070&auto=format&fit=crop'
        ];

        // ==================== 状态与 DOM 缓存 ====================
        const dom = {};
        const state = { engine: 'bing', bg: 0, open: false, editOpen: false };

        function $(id) { return document.getElementById(id); } // DOM 快捷获取

        function         cacheDOM() {
            const ids = 'clock date searchInput engineBtn engineIcon engineName dropdownMenu searchBtn bookmarks sidebarList navCategories navContent editModal editList editBookmarksBtn closeEditBtn addBookmarkBtn saveEditBtn cancelEditBtn resetEditBtn togglePickerBtn bookmarkPicker pickerContent pickerCount closePickerBtn donePickerBtn'.split(' ');
            ids.forEach(id => dom[id] = $(id));
        }

        // ==================== 存储工具 ====================
        // 安全读写 localStorage（JSON 序列化），异常时返回默认值
        function storageGet(key, fallback = null) {
            try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
        }

        // ==================== 网络请求 ====================
        /** 带超时的 fetch（未使用，保留以备扩展）
         * @param {string} url
         * @param {RequestInit} [options]
         * @param {number} [timeout] */
        function fetchWithTimeout(url, options = {}, timeout = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(id));
        }

        // ==================== 外部数据加载 ====================
        // 优先使用 bookmarks.json，不存在时自动降级到 HTML 内联默认值
        async function loadData() {
            try {
                const res = await fetch('bookmarks.json');
                const data = await res.json();
                if (data.bookmarks) pageData.bookmarks = data.bookmarks;
                if (data.categories) pageData.categories = data.categories;
            } catch {
                // 加载失败，使用内联默认值
            }
        }

        // ==================== 用户编辑的书签（保存到 localStorage）====================
        function loadUserData() {
            const saved = storageGet('userBookmarks');
            if (saved && Array.isArray(saved) && saved.length) {
                pageData.bookmarks = saved;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function faviconFromUrl(url) {
            try { return new URL(url).origin + '/favicon.ico'; } catch { return ''; }
        }

        // ==================== 编辑快捷书签弹窗 ====================
        function renderEditList() {
            dom.editList.innerHTML = pageData.bookmarks.map((bm, i) => `
                <div class="flex items-center gap-1.5 p-1.5 apple-radius hover:bg-white/5" draggable="true" data-idx="${i}">
                    <svg class="w-3.5 h-3.5 shrink-0 text-white/20" viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="4" r="1.5"/><circle cx="11" cy="4" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="12" r="1.5"/></svg>
                    <input type="text" class="edit-name flex-1 bg-white/5 border border-white/10 rounded px-2 py-1.5 text-sm text-white/80 outline-none focus:border-white/30 transition" value="${escapeHtml(bm.name)}" placeholder="名称">
                    <input type="text" class="edit-url flex-[2] bg-white/5 border border-white/10 rounded px-2 py-1.5 text-sm text-white/80 outline-none focus:border-white/30 transition" value="${escapeHtml(bm.url)}" placeholder="URL">
                    <button type="button" class="del-btn shrink-0 p-1.5 hover:bg-white/10 rounded apple-radius text-white/30 hover:text-red-400 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            `).join('');
        }

        function collectEditData() {
            const items = dom.editList.querySelectorAll('[data-idx]');
            const bookmarks = [];
            items.forEach(el => {
                const name = el.querySelector('.edit-name').value.trim();
                const url = el.querySelector('.edit-url').value.trim();
                if (name && url) bookmarks.push({ name, url, icon: faviconFromUrl(url) });
            });
            return bookmarks;
        }

        function openEditModal() {
            state.editOpen = true;
            renderEditList();
            dom.editModal.classList.add('active');
        }

        function closeEditModal() {
            state.editOpen = false;
            dom.editModal.classList.remove('active');
        }

        function resetBookmarks() {
            // 清除 localStorage 用户编辑，恢复默认书签
            if (!confirm('确定重置为默认书签？')) return;
            localStorage.removeItem('userBookmarks');
            pageData.bookmarks = DEFAULT_BOOKMARKS;
            renderBookmarks();
            closeEditModal();
        }

        // ==================== 从导航页选择弹窗 ====================
        function openBookmarkPicker() {
            dom.bookmarkPicker.classList.add('active');
            renderPickerCategories();
        }

        function closeBookmarkPicker() {
            dom.bookmarkPicker.classList.remove('active');
        }

        // ==================== 编辑列表拖拽排序 ====================
        function initDragSort() {
            let dragSrc = null;
            dom.editList.addEventListener('dragstart', e => {
                const item = e.target.closest('[data-idx]');
                if (!item) return;
                dragSrc = item;
                item.style.opacity = '0.4';
                e.dataTransfer.effectAllowed = 'move';
            });
            dom.editList.addEventListener('dragend', () => {
                if (dragSrc) dragSrc.style.opacity = '';
                dom.editList.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            });
            dom.editList.addEventListener('dragover', e => {
                e.preventDefault();
                const target = e.target.closest('[data-idx]');
                if (!target || target === dragSrc) return;
                dom.editList.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                target.classList.add('drag-over');
            });
            dom.editList.addEventListener('drop', e => {
                e.preventDefault();
                dom.editList.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                const target = e.target.closest('[data-idx]');
                if (!target || !dragSrc || target === dragSrc) return;
                const rect = target.getBoundingClientRect();
                if (e.clientY < rect.top + rect.height / 2) {
                    target.parentNode.insertBefore(dragSrc, target);
                } else {
                    target.parentNode.insertBefore(dragSrc, target.nextSibling);
                }
            });
        }

        /** 渲染导航页所有分类书签，已存在的标记灰色 + 已存在文字 */
        function renderPickerCategories() {
            const urls = new Set();
            dom.editList.querySelectorAll('.edit-url').forEach(inp => urls.add(inp.value.trim()));
            pageData.bookmarks.forEach(bm => urls.add(bm.url));

            dom.pickerContent.innerHTML = pageData.categories.map(cat => `
                <div>
                    <div class="flex items-center gap-1.5 mb-1.5 pb-1 border-b border-white/5">
                        <span class="text-sm">${cat.icon}</span>
                        <h4 class="text-xs font-medium text-white/70">${cat.name}</h4>

                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-1">

                            const exists = urls.has(bm.url);

                                    <img src="${bm.icon}" class="w-4 h-4 rounded shrink-0" alt="" onerror="this.remove()">
                                    <span class="text-xs text-white/70 truncate flex-1">${escapeHtml(bm.name)}</span>
                                    ${exists
                                        ? '<span class="text-[10px] text-white/20 shrink-0">已存在</span>'
                                        : '<span class="text-white/40 shrink-0 text-sm">+</span>'
                                    }
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
            updatePickerCount();
        }

        function updatePickerCount() {
            const count = dom.editList.querySelectorAll('[data-idx]').length;
            dom.pickerCount.textContent = `已添加 ${count} 项`;
        }

        // ==================== 后台预加载图标 ====================
        function preloadFavicons() {
            const urls = new Set();
            pageData.bookmarks.forEach(bm => { if (bm.icon) urls.add(bm.icon); });
            pageData.categories.forEach(cat => cat.bookmarks.forEach(bm => { if (bm.icon) urls.add(bm.icon); }));
            urls.forEach(url => { const img = new Image(); img.src = url; });
        }

        async function init() {
            cacheDOM();
            await loadData();
            loadUserData();
            renderBookmarks();
            renderNavCategories();
            initSidebarNav();
            initScrollControl();
            const saved = storageGet('preferredEngine');
            if (saved && engines[saved]) setEngine(saved, false);
            updateClock(); setInterval(updateClock, 1000);
            bindEvents();
            bindEditEvents();
            preloadNextBg();
            preloadFavicons();
        }

        // ==================== 书签 ====================
        function renderBookmarks() {
            if (!dom.bookmarks) return;
            dom.bookmarks.innerHTML = pageData.bookmarks.map(bm => `
                <a href="${bm.url}" target="_blank" rel="noopener" 
                   class="bookmark-item flex flex-col items-center justify-center gap-2 p-3 apple-radius text-white/90 hover:text-white">

        // ==================== 导航页（左右布局）====================
        function renderNavCategories() {
            if (!dom.sidebarList || !dom.navCategories) return;

            // 左侧分类列表
            dom.sidebarList.innerHTML = pageData.categories.map((cat, i) => `
                <button class="sidebar-item w-full text-left text-xs md:text-sm px-2.5 py-2 apple-radius text-white/70 ${i === 0 ? 'active' : ''}"

        // ==================== 侧边栏导航 ====================
        function initSidebarNav() {
            const sidebar = dom.sidebarList;
            const content = dom.navContent;
            if (!sidebar || !content) return;

            const items = sidebar.querySelectorAll('[data-target]');
            const sections = [];
            items.forEach(item => {
                const el = document.getElementById(item.dataset.target);
                if (el) sections.push(el);
            });

            // 根据滚动位置更新高亮：取距内容顶部 < 100px 的最后一个分区作为活跃项
            function updateActive() {
                const scrollTop = content.scrollTop;
                let activeIdx = 0;
                for (let i = 0; i < sections.length; i++) {
                    if (sections[i].offsetTop - scrollTop < 100) activeIdx = i;
                }
                items.forEach((item, i) => item.classList.toggle('active', i === activeIdx));
            }

            // 点击侧边栏 → 平滑滚动并高亮
            sidebar.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-target]');
                if (!btn) return;
                const target = document.getElementById(btn.dataset.target);
                if (target) {
                    items.forEach(i => i.classList.remove('active'));
                    btn.classList.add('active');
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });

            // 滚动时更新高亮（节流）
            let ticking = false;
            content.addEventListener('scroll', () => {
                if (!ticking) {
                    requestAnimationFrame(() => { updateActive(); ticking = false; });
                    ticking = true;
                }
            });
        }
        function bindEvents() {
            dom.searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
            dom.searchBtn.addEventListener('click', doSearch);

            // 引擎下拉菜单
            dom.engineBtn.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(); });
            dom.dropdownMenu.addEventListener('click', e => {
                const btn = e.target.closest('[data-engine]');
                if (btn) { e.stopPropagation(); setEngine(btn.dataset.engine); }
            });
            document.addEventListener('click', closeDropdown);
            window.addEventListener('blur', closeDropdown);

            // 键盘快捷键：任意可打印字符聚焦搜索，Ctrl/Cmd+B 切换壁纸，Escape 失焦
            document.addEventListener('keydown', e => {
                if ((e.key === 'b' || e.key === 'B') && (e.metaKey || e.ctrlKey) && document.activeElement !== dom.searchInput) { switchBg(); return; }
                if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
                if (e.key.length === 1 && document.activeElement !== dom.searchInput && document.activeElement?.tagName !== 'INPUT') { dom.searchInput.focus(); return; }
                if (e.key === 'Escape') { closeDropdown(); dom.searchInput.blur(); closeEditModal(); }
            });
        }

        // ==================== 编辑弹窗事件绑定 ====================
        function bindEditEvents() {
            dom.editBookmarksBtn.addEventListener('click', openEditModal);
            dom.closeEditBtn.addEventListener('click', closeEditModal);
            dom.cancelEditBtn.addEventListener('click', closeEditModal);
            dom.resetEditBtn.addEventListener('click', resetBookmarks);
            dom.editModal.addEventListener('click', closeEditModal);
            dom.togglePickerBtn.addEventListener('click', e => { e.stopPropagation(); openBookmarkPicker(); });
            dom.closePickerBtn.addEventListener('click', closeBookmarkPicker);
            dom.donePickerBtn.addEventListener('click', closeBookmarkPicker);
            dom.bookmarkPicker.addEventListener('click', closeBookmarkPicker);

            dom.pickerContent.addEventListener('click', e => {
                const item = e.target.closest('.picker-item');

                const url = item.dataset.url;

                dom.editList.querySelectorAll('.edit-url').forEach(inp => urls.add(inp.value.trim()));

                div.innerHTML = `
                    <svg class="w-3.5 h-3.5 shrink-0 text-white/20" viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="4" r="1.5"/><circle cx="11" cy="4" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="12" r="1.5"/></svg>
                    <input type="text" class="edit-name flex-1 bg-white/5 border border-white/10 rounded px-2 py-1.5 text-sm text-white/80 outline-none focus:border-white/30 transition" value="${escapeHtml(name)}" placeholder="名称">
                    <input type="text" class="edit-url flex-[2] bg-white/5 border border-white/10 rounded px-2 py-1.5 text-sm text-white/80 outline-none focus:border-white/30 transition" value="${escapeHtml(url)}" placeholder="URL">
                    <button type="button" class="del-btn shrink-0 p-1.5 hover:bg-white/10 rounded apple-radius text-white/30 hover:text-red-400 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                `;
                dom.editList.appendChild(div);
                item.classList.add('opacity-40', 'pointer-events-none');
                item.dataset.name = '';
                item.dataset.url = '';
                item.querySelector('span:last-child').textContent = '✓';
                updatePickerCount();
            });

            dom.addBookmarkBtn.addEventListener('click', () => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-1.5 p-1.5 apple-radius hover:bg-white/5';
                div.setAttribute('data-idx', Date.now());
                div.draggable = true;
                div.innerHTML = `
                    <svg class="w-3.5 h-3.5 shrink-0 text-white/20" viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="4" r="1.5"/><circle cx="11" cy="4" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="12" r="1.5"/></svg>
                    <input type="text" class="edit-name flex-1 bg-white/5 border border-white/10 rounded px-2 py-1.5 text-sm text-white/80 outline-none focus:border-white/30 transition" placeholder="名称">
                    <input type="text" class="edit-url flex-[2] bg-white/5 border border-white/10 rounded px-2 py-1.5 text-sm text-white/80 outline-none focus:border-white/30 transition" placeholder="URL">
                    <button type="button" class="del-btn shrink-0 p-1.5 hover:bg-white/10 rounded apple-radius text-white/30 hover:text-red-400 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                `;
                dom.editList.appendChild(div);
                div.querySelector('.edit-name').focus();
            });

            dom.editList.addEventListener('click', e => {
                const del = e.target.closest('.del-btn');
                if (del) { del.closest('[data-idx]')?.remove(); updatePickerCount(); }
            });

            dom.saveEditBtn.addEventListener('click', () => {
                const data = collectEditData();
                if (data.length === 0) return;
                pageData.bookmarks = data;
                storageSet('userBookmarks', data);
                renderBookmarks();
                closeEditModal();
            });
            initDragSort();
        }

        // ==================== 时钟 ====================
        function updateClock() {
            const n = new Date();
            dom.clock.textContent = `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
            dom.date.textContent = n.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }

        // ==================== 搜索引擎切换 ====================
        function toggleDropdown() {
            state.open = !state.open;
            dom.dropdownMenu.classList.toggle('active', state.open);
        }
        function closeDropdown() {
            state.open = false;
            dom.dropdownMenu.classList.remove('active');
        }
        /** @param {string} key - 引擎标识（bing/google/duckduckgo/baidu）
         * @param {boolean} [save] - 是否持久化到 localStorage */
        function setEngine(key, save = true) {
            state.engine = key;
            dom.engineName.textContent = engines[key].name;
            dom.engineIcon.src = engines[key].icon;
            closeDropdown();
            if (save) storageSet('preferredEngine', key);
        }
        function doSearch() {
            const q = dom.searchInput.value.trim();
            if (!q) return;
            window.location.href = engines[state.engine].url + encodeURIComponent(q);
        }

        // ==================== 壁纸切换 ====================
        function preloadNextBg() {
            const img = new Image();
            img.src = backgrounds[(state.bg + 1) % backgrounds.length];
        }
        function switchBg() {
            state.bg = (state.bg + 1) % backgrounds.length;
            document.body.style.backgroundImage = `url('${backgrounds[state.bg]}')`;
            preloadNextBg();
        }

        // ==================== 滚动切换 ====================
        function initScrollControl() {
            let scrollAccum = 0;
            let isTransitioning = false;
            let currentSection = 'start';
            const SCROLL_THRESHOLD = 120; // 累积滚动像素阈值（跨浏览器一致）
            const nav = document.getElementById('navSection');
            const navContent = dom.navContent;
            let animationDone = false;

            // ===== sessionStorage 刷新保持：恢复/保存页面位置 =====
            function getSavedSection() {
                try { return sessionStorage.getItem('startpage_section'); } catch { return null; }
            }
            function saveSection(s) {
                try { sessionStorage.setItem('startpage_section', s); } catch {}
            }

            // 若上次在导航页或滚动超过 40% 视口，直接显示导航区并跳过入场动画
            if (getSavedSection() === 'nav' || window.scrollY > window.innerHeight * 0.4) {
                nav.classList.remove('nav-hidden');
                nav.classList.add('nav-visible');
                document.documentElement.classList.remove('nr');
                window.scrollTo(0, nav.offsetTop);
                currentSection = 'nav';
                animationDone = true;
            } else {
                saveSection('start');
            }

            // 归一化 deltaY，兼容 Safari 的 LINE / PAGE 模式
            function normDelta(e) {
                let d = e.deltaY;
                if (e.deltaMode === 1) d *= 16;       // DOM_DELTA_LINE → 像素
                else if (e.deltaMode === 2) d *= 400;  // DOM_DELTA_PAGE → 像素
                return d;
            }

            document.addEventListener('wheel', (e) => {
                if (isTransitioning) { e.preventDefault(); return; }
                if (state.editOpen) return;

                const delta = normDelta(e);
                const down = delta > 0;

                if (currentSection === 'start') {
                    if (!down) { scrollAccum = Math.max(0, scrollAccum + delta); return; }
                    e.preventDefault();
                    scrollAccum += delta;
                    if (scrollAccum < SCROLL_THRESHOLD) return;
                    scrollAccum = 0;
                    isTransitioning = true;
                    saveSection('nav');

                    // 1) 先显示导航（无 transform 偏移，不会导致重排闪烁）
                    nav.classList.remove('nav-hidden');
                    nav.classList.add('nav-visible');
                    if (!animationDone) {
                        document.getElementById('navHint')?.classList.add('hint-up');
                        animationDone = true;
                    }

                    // 2) 下一帧再滚动（分离布局变化与滚动，避免 Safari 同时处理两件事导致卡顿/闪烁）
                    requestAnimationFrame(() => {
                        nav.scrollIntoView({ behavior: 'smooth' });
                        waitForScroll(nav.offsetTop, () => {
                            currentSection = 'nav';
                            isTransitioning = false;
                        });
                    });
                } else {
                    if (navContent.scrollTop > 0 || down) {
                        e.preventDefault();
                        // 限制单次滚动增量，避免 Safari 跳度过大
                        navContent.scrollTop += Math.min(Math.abs(delta), 60) * (down ? 1 : -1);
                        if (down) scrollAccum = 0;
                    } else if (!down && navContent.scrollTop <= 0) {
                        e.preventDefault();
                        scrollAccum += Math.abs(delta);
                        if (scrollAccum >= SCROLL_THRESHOLD) {
                            scrollAccum = 0;
                            isTransitioning = true;
                            saveSection('start');
                            navContent.scrollTop = 0;
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                            waitForScroll(0, () => {
                                animationDone = false;
                                currentSection = 'start';
                                isTransitioning = false;
                            });
                        }
                    }
                }
            }, { passive: false });

            // ==================== 触屏支持 ====================
            let touchStartY = 0;
            let touchStartTime = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (isTransitioning || state.editOpen) return;
                const deltaY = touchStartY - e.touches[0].clientY;
                if (Math.abs(deltaY) < 10) return;

                if (currentSection === 'start') {
                    if (deltaY > 0) {
                        e.preventDefault();
                        scrollAccum += Math.abs(deltaY);
                        if (scrollAccum >= SCROLL_THRESHOLD) {
                            scrollAccum = 0;
                            isTransitioning = true;
                            saveSection('nav');
                            nav.classList.remove('nav-hidden');
                            nav.classList.add('nav-visible');
                            if (!animationDone) {
                                document.getElementById('navHint')?.classList.add('hint-up');
                                animationDone = true;
                            }
                            requestAnimationFrame(() => {
                                nav.scrollIntoView({ behavior: 'smooth' });
                                waitForScroll(nav.offsetTop, () => {
                                    currentSection = 'nav';
                                    isTransitioning = false;
                                });
                            });
                        }
                    }
                } else {
                    if (navContent.scrollTop > 0 || deltaY > 0) {
                        e.preventDefault();
                        navContent.scrollTop += deltaY;
                        touchStartY = e.touches[0].clientY;
                    } else if (deltaY < 0 && navContent.scrollTop <= 0) {
                        e.preventDefault();
                        scrollAccum += Math.abs(deltaY);
                        if (scrollAccum >= SCROLL_THRESHOLD) {
                            scrollAccum = 0;
                            isTransitioning = true;
                            saveSection('start');
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                            waitForScroll(0, () => {
                                animationDone = false;
                                currentSection = 'start';
                                isTransitioning = false;
                            });
                        }
                    }
                }
            }, { passive: false });

            /** 轮询等待 scrollIntoView/scrollTo 完成，兜底 120 帧（~2s）超时
             * @param {number} target - 目标 scrollY
             * @param {Function} cb - 完成回调
             * @param {number} [attempts] - 当前尝试计数 */
            function waitForScroll(target, cb, attempts = 0) {
                if (Math.abs(window.scrollY - target) < 2) { cb(); return; }
                if (attempts > 120) { cb(); return; } // 超时保护 ~2s
                requestAnimationFrame(() => waitForScroll(target, cb, attempts + 1));
            }

            // ==================== 窗口变化修正：全屏/旋转/缩放后保持导航页在视口顶部 ====================
            var resizeTick = null;
            function scrollToNav() {
                if (currentSection !== 'nav') return;
                var target = nav.offsetTop;
                if (Math.abs(window.scrollY - target) > 2) {
                    window.scrollTo(0, target);
                    requestAnimationFrame(scrollToNav);
                }
            }
            function onViewportChange() {
                if (currentSection !== 'nav' || resizeTick) return;
                resizeTick = requestAnimationFrame(function() {
                    resizeTick = null;
                    scrollToNav();
                });
            }
            document.addEventListener('fullscreenchange', onViewportChange);
            document.addEventListener('webkitfullscreenchange', onViewportChange);
            window.addEventListener('resize', onViewportChange);
        }

        // ==================== 启动（兼容 DOMContentLoaded）====================
        document.readyState === 'loading'
            ? document.addEventListener('DOMContentLoaded', init)
            : init();
    </script>
</body>
</html>
