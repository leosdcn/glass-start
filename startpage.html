<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Start</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.15);
            --radius: 1.5rem;
            --blur: 24px;
        }
        body { font-family: 'Nunito', sans-serif; scrollbar-width:none; -ms-overflow-style:none; 
               overflow:hidden; }
        body::-webkit-scrollbar { display:none; }
        * { scrollbar-width:none; -ms-overflow-style:none; }
        *::-webkit-scrollbar { display:none; }
        .apple-radius { border-radius: var(--radius); }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            will-change: backdrop-filter;
        }
        .glass-strong {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            will-change: backdrop-filter;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.6); }
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .dropdown-menu { opacity:0; transform:translateY(-10px); pointer-events:none; transition:all 0.2s ease; }
        .dropdown-menu.active { opacity:1; transform:translateY(0); pointer-events:auto; }
        .clock-text { text-shadow: 0 2px 20px rgba(0,0,0,0.4), 0 0 60px rgba(0,0,0,0.2); }
        .bookmark-item { transition: all 0.2s ease; }
        .bookmark-item:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
        .nav-bookmark { transition: all 0.15s ease; }
        .nav-bookmark:hover { background: rgba(255,255,255,0.1); }
        .nav-hidden { visibility:hidden; }
        .nav-visible { visibility:visible; }
        .nav-hidden .glass { opacity:0; }
        .nav-visible .glass { animation:navFadeIn 0.6s ease forwards; }
        @keyframes navFadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .sidebar-item {
            transition: all 0.15s ease;
            border-left: 2px solid transparent;
        }
        .sidebar-item:hover { background: rgba(255,255,255,0.08); }
        .sidebar-item.active {
            background: rgba(255,255,255,0.12);
            border-left-color: rgba(255,255,255,0.6);
            color: #fff;
        }
        .scroll-hint { animation: bounceDown 2s ease-in-out infinite; }
        @keyframes bounceDown { 0%,100%{transform:translateY(0);opacity:0.6} 50%{transform:translateY(8px);opacity:1} }
        .hint-down { animation:hintFade 7s ease forwards; }
        .hint-up { animation:hintFade 6s ease 1s forwards; }
        @keyframes hintFade { 0%,55%{opacity:1} 100%{opacity:0;pointer-events:none} }
        .section-divider { background: linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent); }
    </style>
</head>
<body class="bg-cover bg-center bg-no-repeat text-white relative" 
      style="background-color:#1a1a2e;background-image:url('https://images.unsplash.com/photo-1477346611705-65d1883cee1e?q=80&w=2070&auto=format&fit=crop');background-attachment:fixed">

                    </button>

                        <img src="https://www.google.com/favicon.ico" class="w-4 h-4 rounded-sm" alt="" onerror="this.style.display='none'"> Google
                    </button>
                    <button type="button" data-engine="duckduckgo" class="w-full flex items-center gap-3 px-3 py-2.5 apple-radius hover:bg-white/10 transition text-left text-sm">
                        <img src="https://duckduckgo.com/favicon.ico" class="w-4 h-4 rounded-sm" alt="" onerror="this.style.display='none'"> DuckDuckGo
                    </button>
                    <button type="button" data-engine="baidu" class="w-full flex items-center gap-3 px-3 py-2.5 apple-radius hover:bg-white/10 transition text-left text-sm">

                    </button>
                </div>
            </div>

            <!-- 快捷书签 -->
            <div class="w-full max-w-2xl lg:max-w-3xl glass apple-radius p-4 fade-in mb-6 md:mb-8" style="animation-delay:0.2s">
                <div id="bookmarks" class="grid grid-cols-4 md:grid-cols-8 gap-2"></div>
            </div>
        </div>

        <!-- 向下滚动提示（装饰，绝对定位不占空间） -->
        <div class="absolute bottom-6 md:bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1 text-white/35 text-[10px] tracking-widest pointer-events-none hint-down">
            <span>向下滚动</span>
            <svg class="w-4 h-4 scroll-hint" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
        </div>
    </section>

    <!-- 分隔线 -->
    <div class="section-divider h-px relative z-10 mx-auto w-3/4 max-w-2xl"></div>

    <!-- ========== 第二屏：分类导航 ========== -->
    <section id="navSection" class="relative z-10 h-screen nav-hidden overflow-hidden">
        <div class="h-full flex flex-col pt-8 md:pt-10">
            <!-- 标题 -->
            <div class="text-center shrink-0 px-4">
                <h2 class="text-base md:text-lg font-light tracking-wider">🪐 导航</h2>
                <p class="text-[10px] text-white/40 mt-0.5 tracking-wide">发现更多精彩网站</p>
            </div>
            <!-- 向上返回提示 -->
            <div id="navHint" class="flex items-center justify-center gap-0.5 py-1 text-white/15 text-[9px] tracking-widest shrink-0 pointer-events-none">
                <svg class="w-2.5 h-2.5 scroll-hint" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                <span>向上滚动返回</span>
            </div>
            <!-- 主体：左分类 + 右内容 -->
            <div class="flex-1 flex gap-2 md:gap-3 px-3 md:px-4 pb-3 min-h-0">
                <!-- 左侧分类列表 -->
                <aside id="sidebar" class="w-32 md:w-40 shrink-0 glass apple-radius p-1.5 md:p-2 overflow-y-auto" style="scrollbar-width:none;-ms-overflow-style:none;">
                    <div id="sidebarList" class="flex flex-col gap-0.5"></div>
                </aside>
                <!-- 右侧书签内容 -->

                </main>

        // ==================== 配置 ====================
        const engines = {
            bing: { name: 'Bing', icon: 'https://www.bing.com/favicon.ico', url: 'https://www.bing.com/search?q=' },

            'https://images.unsplash.com/photo-1477346611705-65d1883cee1e?q=80&w=2070&auto=format&fit=crop',

        ];

        // ==================== 状态与 DOM 缓存 ====================
        const dom = {};
        const state = { engine: 'bing', bg: 0, open: false };

        function $(id) { return document.getElementById(id); }

        function cacheDOM() {
            const ids = 'clock date searchInput engineBtn engineIcon engineName dropdownMenu searchBtn bookmarks sidebarList navCategories navContent'.split(' ');
            ids.forEach(id => dom[id] = $(id));
        }

        // ==================== 存储工具 ====================
        function storageGet(key, fallback = null) {
            try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
        }

        // ==================== 网络请求 ====================
        function fetchWithTimeout(url, options = {}, timeout = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(id));
        }

        // ==================== 初始化 ====================
        function init() {
            cacheDOM();
            renderBookmarks();
            renderNavCategories();
            initSidebarNav();
            initScrollControl();
            const saved = storageGet('preferredEngine');
            if (saved && engines[saved]) setEngine(saved, false);
            updateClock(); setInterval(updateClock, 1000);
            bindEvents();
            preloadNextBg();
        }

        // ==================== 书签 ====================
        function renderBookmarks() {
            if (!dom.bookmarks) return;
            dom.bookmarks.innerHTML = BOOKMARKS.map(bm => `
                <a href="${bm.url}" target="_blank" rel="noopener" 
                   class="bookmark-item flex flex-col items-center justify-center gap-2 p-3 apple-radius text-white/90 hover:text-white">
                    <img src="${bm.icon}" class="w-8 h-8 rounded-lg opacity-90" alt="" 
                         onerror="this.style.display='none'">
                    <span class="text-xs truncate w-full text-center">${bm.name}</span>
                </a>
            `).join('');
        }

        // ==================== 分类导航（左右布局）====================
        function renderNavCategories() {
            if (!dom.sidebarList || !dom.navCategories) return;

            // 左侧分类列表
            dom.sidebarList.innerHTML = CATEGORIES.map((cat, i) => `
                <button class="sidebar-item w-full text-left text-xs md:text-sm px-2.5 py-2 apple-radius text-white/70 ${i === 0 ? 'active' : ''}"
                        data-target="cat-${i}">
                    <span class="mr-1.5">${cat.icon}</span>${cat.name}
                </button>
            `).join('');

            // 右侧书签内容
            dom.navCategories.innerHTML = CATEGORIES.map((cat, i) => `
                <div id="cat-${i}" class="mb-6 md:mb-8 ${i > 0 ? 'scroll-mt-4' : ''}">
                    <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
                        <span class="text-lg">${cat.icon}</span>
                        <h3 class="text-sm md:text-base font-medium tracking-wide text-white/90">${cat.name}</h3>
                        <span class="ml-auto text-[10px] text-white/30">${cat.bookmarks.length} 个</span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 md:gap-3">
                        ${cat.bookmarks.map(bm => `
                            <a href="${bm.url}" target="_blank" rel="noopener"
                               class="nav-bookmark flex items-center gap-2.5 px-2.5 md:px-3 py-2 md:py-2.5 apple-radius text-white/75 hover:text-white rounded-xl">
                                <img src="${bm.icon}" class="w-5 h-5 rounded shrink-0" alt=""
                                     onerror="this.style.display='none'">
                                <span class="text-xs md:text-sm truncate">${bm.name}</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // ==================== 侧边栏导航 ====================
        function initSidebarNav() {
            const sidebar = dom.sidebarList;
            const content = dom.navContent;
            if (!sidebar || !content) return;

            const items = sidebar.querySelectorAll('[data-target]');
            const sections = [];
            items.forEach(item => {
                const el = document.getElementById(item.dataset.target);
                if (el) sections.push(el);
            });

            // 根据滚动位置更新高亮
            function updateActive() {
                const scrollTop = content.scrollTop;
                let activeIdx = 0;
                for (let i = 0; i < sections.length; i++) {
                    if (sections[i].offsetTop - scrollTop < 100) activeIdx = i;
                }
                items.forEach((item, i) => item.classList.toggle('active', i === activeIdx));
            }

            // 点击侧边栏 → 平滑滚动并高亮
            sidebar.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-target]');
                if (!btn) return;
                const target = document.getElementById(btn.dataset.target);
                if (target) {
                    items.forEach(i => i.classList.remove('active'));
                    btn.classList.add('active');
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });

            // 滚动时更新高亮（节流）
            let ticking = false;
            content.addEventListener('scroll', () => {
                if (!ticking) {
                    requestAnimationFrame(() => { updateActive(); ticking = false; });
                    ticking = true;
                }
            });
        }
        function bindEvents() {
            dom.searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
            dom.searchBtn.addEventListener('click', doSearch);

            // 引擎下拉菜单
            dom.engineBtn.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(); });
            dom.dropdownMenu.addEventListener('click', e => {
                const btn = e.target.closest('[data-engine]');
                if (btn) { e.stopPropagation(); setEngine(btn.dataset.engine); }
            });
            document.addEventListener('click', closeDropdown);
            window.addEventListener('blur', closeDropdown);

            // 键盘快捷键
            document.addEventListener('keydown', e => {
                if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
                if ((e.key === 'b' || e.key === 'B') && document.activeElement !== dom.searchInput) switchBg();
                if (e.key === '/' && document.activeElement !== dom.searchInput) { e.preventDefault(); dom.searchInput.focus(); }
                if (e.key === 'Escape') { closeDropdown(); dom.searchInput.blur(); }
            });
        }

        // ==================== 时钟 ====================
        function updateClock() {
            const n = new Date();
            dom.clock.textContent = `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
            dom.date.textContent = n.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }

        // ==================== 搜索引擎切换 ====================
        function toggleDropdown() {
            state.open = !state.open;
            dom.dropdownMenu.classList.toggle('active', state.open);
        }
        function closeDropdown() {
            state.open = false;
            dom.dropdownMenu.classList.remove('active');
        }
        function setEngine(key, save = true) {
            state.engine = key;
            dom.engineName.textContent = engines[key].name;
            dom.engineIcon.src = engines[key].icon;
            closeDropdown();
            if (save) storageSet('preferredEngine', key);
        }
        function doSearch() {
            const q = dom.searchInput.value.trim();
            if (!q) return;
            window.location.href = engines[state.engine].url + encodeURIComponent(q);
        }

        // ==================== 背景切换 ====================
        function preloadNextBg() {
            const img = new Image();
            img.src = backgrounds[(state.bg + 1) % backgrounds.length];
        }
        function switchBg() {
            state.bg = (state.bg + 1) % backgrounds.length;
            document.body.style.backgroundImage = `url('${backgrounds[state.bg]}')`;
            preloadNextBg();
        }

        // ==================== 滚动入场动画 ====================
        function initScrollControl() {
            let scrollAccum = 0;
            let isTransitioning = false;
            let currentSection = 'start';
            const SCROLL_THRESHOLD = 120; // 累积滚动像素阈值（跨浏览器一致）
            const nav = document.getElementById('navSection');
            const navContent = dom.navContent;
            let animationDone = false;

            // 归一化 deltaY，兼容 Safari 的 LINE / PAGE 模式
            function normDelta(e) {
                let d = e.deltaY;
                if (e.deltaMode === 1) d *= 16;       // DOM_DELTA_LINE → 像素
                else if (e.deltaMode === 2) d *= 400;  // DOM_DELTA_PAGE → 像素
                return d;
            }

            document.addEventListener('wheel', (e) => {
                if (isTransitioning) { e.preventDefault(); return; }

                const delta = normDelta(e);
                const down = delta > 0;

                if (currentSection === 'start') {
                    if (!down) { scrollAccum = Math.max(0, scrollAccum + delta); return; }
                    e.preventDefault();
                    scrollAccum += delta;
                    if (scrollAccum < SCROLL_THRESHOLD) return;
                    scrollAccum = 0;
                    isTransitioning = true;

                    // 1) 先显示导航（无 transform 偏移，不会导致重排闪烁）
                    nav.classList.remove('nav-hidden');
                    nav.classList.add('nav-visible');
                    if (!animationDone) {
                        document.getElementById('navHint')?.classList.add('hint-up');
                        animationDone = true;
                    }

                    // 2) 下一帧再滚动（分离布局变化与滚动，避免 Safari 卡顿）
                    requestAnimationFrame(() => {
                        nav.scrollIntoView({ behavior: 'smooth' });
                        waitForScroll(nav.offsetTop, () => {
                            currentSection = 'nav';
                            isTransitioning = false;
                        });
                    });
                } else {
                    if (navContent.scrollTop > 0 || down) {
                        e.preventDefault();
                        // 限制单次滚动增量，避免 Safari 跳度过大
                        navContent.scrollTop += Math.min(Math.abs(delta), 60) * (down ? 1 : -1);
                        scrollAccum = 0;
                    } else if (!down && navContent.scrollTop <= 0) {
                        e.preventDefault();
                        scrollAccum += Math.abs(delta);
                        if (scrollAccum >= SCROLL_THRESHOLD) {
                            scrollAccum = 0;
                            isTransitioning = true;
                            navContent.scrollTop = 0;
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                            waitForScroll(0, () => {
                                currentSection = 'start';
                                isTransitioning = false;
                            });
                        }
                    }
                }
            }, { passive: false });

            function waitForScroll(target, cb, attempts = 0) {
                if (Math.abs(window.scrollY - target) < 2) { cb(); return; }
                if (attempts > 120) { cb(); return; } // 超时保护 ~2s
                requestAnimationFrame(() => waitForScroll(target, cb, attempts + 1));
            }
        }

        // ==================== 启动 ====================
        document.readyState === 'loading'
            ? document.addEventListener('DOMContentLoaded', init)
            : init();
    </script>
</body>
