<svg viewBox="4 4 92 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gs_sphere" cx="34%" cy="26%" r="76%">
      <stop offset="0%" stop-color="#FFF2C6"/>
      <stop offset="30%" stop-color="#F8C66A"/>
      <stop offset="64%" stop-color="#E49A48"/>
      <stop offset="88%" stop-color="#B46A30"/>
      <stop offset="100%" stop-color="#79401F"/>
    </radialGradient>
    <radialGradient id="gs_specular">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gs_outer_ring" gradientUnits="userSpaceOnUse" x1="5" y1="65" x2="95" y2="35">
      <stop offset="0%" stop-color="#BDD6E9"/>
      <stop offset="50%" stop-color="#9DB9CC"/>
      <stop offset="100%" stop-color="#718FA4"/>
    </linearGradient>
    <linearGradient id="gs_inner_ring" gradientUnits="userSpaceOnUse" x1="7" y1="65" x2="93" y2="35">
      <stop offset="0%" stop-color="#DFECF4"/>
      <stop offset="35%" stop-color="#C5DAE8"/>
      <stop offset="70%" stop-color="#AAC4D6"/>
      <stop offset="100%" stop-color="#87A7BD"/>
    </linearGradient>
    <linearGradient id="gs_ring_shadow" gradientUnits="userSpaceOnUse" x1="50" y1="58" x2="50" y2="66">
      <stop offset="0%" stop-color="#593B23" stop-opacity="0"/>
      <stop offset="45%" stop-color="#593B23" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#593B23" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gs_sphere_clip">
      <circle cx="50" cy="50" r="25"/>
    </clipPath>
    <clipPath id="gs_ring_front_half">
      <rect x="0" y="50" width="100" height="50"/>
    </clipPath>
    <!-- 整环只绘制一次，遮住位于球体后方的上半部，消除两侧接缝 -->
    <mask id="gs_ring_visibility" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" style="mask-type:luminance">
      <rect width="100" height="100" fill="#FFFFFF"/>
      <path d="M 25 50 A 25 25 0 0 1 75 50 Z" fill="#000000"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="25" fill="url(#gs_sphere)"/>
  <g clip-path="url(#gs_sphere_clip)">
    <!-- 云带与星环共用赤道方向，边界延伸至裁切区外 -->
    <g transform="rotate(-25 50 50)">
      <path d="M 20 38 Q 50 44 80 38 L 80 41 Q 50 47 20 41 Z" fill="#FFEDB8" fill-opacity="0.2"/>
      <path d="M 20 47 Q 50 53 80 47 L 80 50 Q 50 56 20 50 Z" fill="#B97936" fill-opacity="0.2"/>
      <path d="M 20 57 Q 50 63 80 57 L 80 59 Q 50 65 20 59 Z" fill="#FFE0A1" fill-opacity="0.16"/>
      <!-- 窄幅渐隐投影沿前侧环盘下缘分布，不再横切整个球面 -->
      <g clip-path="url(#gs_ring_front_half)">
        <ellipse cx="50" cy="52" rx="36.5" ry="12.8" stroke="url(#gs_ring_shadow)" stroke-width="3"/>
      </g>
    </g>
    <ellipse cx="41" cy="34" rx="16" ry="12" transform="rotate(-25 41 34)" fill="url(#gs_specular)"/>
  </g>
  <g transform="rotate(-25 50 50)" mask="url(#gs_ring_visibility)">
    <!-- 各边界保持相同比例的椭圆投影，形成共面宽环盘及一道细环缝 -->
    <path fill-rule="evenodd" d="M 2 50 A 48 16.8 0 1 0 98 50 A 48 16.8 0 1 0 2 50 Z M 6 50 A 44 15.4 0 1 0 94 50 A 44 15.4 0 1 0 6 50 Z" fill="url(#gs_outer_ring)"/>
    <path fill-rule="evenodd" d="M 7.2 50 A 42.8 14.98 0 1 0 92.8 50 A 42.8 14.98 0 1 0 7.2 50 Z M 19 50 A 31 10.85 0 1 0 81 50 A 31 10.85 0 1 0 19 50 Z" fill="url(#gs_inner_ring)"/>
  </g>
</svg>
