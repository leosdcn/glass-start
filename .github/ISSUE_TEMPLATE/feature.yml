name: 💡 需求或改进建议 (Feature Request)
description: 提出新功能想法、交互优化或体验改进建议
title: "[建议]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享您的想法！Glass Start 秉承 **“如无必要，勿增实体”** 与 **“极简纯净”** 的原则，倡导最小必要功能，避免功能过度堆砌。
  - type: textarea
    id: problem
    attributes:
      label: 遇到的痛点或现状背景
      description: 当前的使用场景中遇到了什么不便？
      placeholder: 我经常需要在 ... 场景下 ...，目前只能 ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 您希望 Glass Start 如何支持或改进？
      placeholder: 希望增加 / 调整 ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 是否有现存其他方式或折中方案？
