name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-checks:
    name: Lint & Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      nu:
        # 官方 Nu 26.11.9.2。校验待发布产物规范。
        image: ghcr.io/validator/validator@sha256:292cef9f3367a6d52447c617e65c94bca04cd3399abb37bd5d17c1c7d430525a
        ports:
          - 8888/tcp
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run selected test suite (typecheck + build + Chrome)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          current_version=$(node -p 'require("./package.json").version')
          if [[ "$EVENT_NAME" == "pull_request" && "$GITHUB_REF" != "refs/heads/main" && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
            { git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$BASE_SHA"; } &&
            previous_version=$(git show "$BASE_SHA:package.json" |
              node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version') &&
            [[ "$previous_version" == "$current_version" ]]; then
            echo "Running quick CI suite"
            npm test -- unit.test.mjs data-pure-models infra-icon-sync \
              infra-build-pipeline infra-security infra-module-boundaries \
              lifecycle infra-sw-upgrade infra-chrome-extension infra-resource-cleanup
          else
            echo "Running full CI suite"
            npm test
          fi

      - name: Validate release HTML & CSS (W3C / Stylelint)
        env:
          W3C_VALIDATOR_URL: http://127.0.0.1:${{ job.services.nu.ports['8888'] }}/?out=json
        run: npm run test:w3c

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Retain the currently deployed app script
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GLASS_PREVIOUS_DEPLOY_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/retain-deployed.cjs

      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/.

  deploy:
    name: Deploy verified site
    needs: linux-checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
