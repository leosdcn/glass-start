<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Start — 天气组件全状态全景测试台 (Weather Lab)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-strong: rgba(18, 24, 38, 0.78);
            --text-main: #f8fafc;
            --text-sub: #d1d9e6;
            --text-muted: #aebcd0;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        button { font: inherit; }
        img, svg { vertical-align: middle; }

        html {
            overflow: hidden;
            background: linear-gradient(rgba(11, 15, 25, 0.55), rgba(11, 15, 25, 0.55)),
                url('../public/wallpapers/bg1.avif') center / cover no-repeat var(--bg-color);
        }

        body {
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            padding: 28px 32px;
            max-width: 1560px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* 三列工作台：设置、天气状态、实时预览 */
        .workspace {
            display: grid;
            grid-template-columns: minmax(280px, 0.85fr) minmax(300px, 1fr) minmax(360px, 1fr);
            grid-template-areas: "controls codes preview";
            gap: 32px;
            align-items: stretch;
            flex: 1;
            min-height: 0;
            grid-template-rows: minmax(0, 1fr);
        }


        /* 控制台容器 */
        .panel {
            grid-area: controls;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 标签与滑块 */
        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .slider-header small {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .slider-header span.val {
            white-space: nowrap;
            font-size: 16px;
            color: var(--accent);
            font-weight: 600;
            font-family: ui-monospace, monospace;
        }

        input[type="range"] {
            appearance: none;
            width: 100%;
            height: 4px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 3px;
            accent-color: var(--accent);
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 开关切换按钮组 */
        .btn-group {
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: transparent;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .toggle-btn.active {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.6);
            color: #e0f2fe;
        }

        .toggle-btn:hover { background: rgba(56, 189, 248, 0.08); }

        .codes-panel { grid-area: codes; min-width: 0; min-height: 0; }
        .codes-panel > .section-title, .codes-panel > .section-note { flex-shrink: 0; }

        .panel, .stage {
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            scrollbar-width: thin;
            scrollbar-color: #64748b transparent;
        }

        .panel > *, .stage > * { flex-shrink: 0; }
        .section-note { color: var(--text-muted); font-size: 13px; }

        /* WMO 代码分类选择网格 */
        .wmo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            flex: 1;
            min-height: 0;
            align-content: start;
            overscroll-behavior-y: contain;
            scrollbar-color: #64748b transparent;
            overflow-y: auto;
            padding-right: 4px;
        }

        .wmo-grid::-webkit-scrollbar {
            width: 4px;
        }

        .wmo-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .wmo-card {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            min-width: 0;
            min-height: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-sub);
            transition: all 0.15s ease;
            user-select: none;
        }

        body:not(.tab-blurred) .wmo-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .wmo-card.active {
            background: rgba(56, 189, 248, 0.18);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .wmo-card span {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .wmo-card img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* 预览工作台 */
        .stage {
            grid-area: preview;

            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            min-width: 0;
        }

        /* 天气胶囊外观预览 */
        .capsule-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .capsule-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            align-self: flex-start;
        }

        .weather-btn {
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 8px 16px;
            border-radius: 9999px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .weather-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            transform: translateY(-1px);
        }

        .weather-btn:active {
            transform: scale(0.97);
        }

        /* 天气详情外观预览 */
        .weather-popover {
            width: 380px;
            max-width: 100%;
            background: rgba(18, 24, 38, 0.82);
            -webkit-backdrop-filter: blur(36px);
            backdrop-filter: blur(36px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .location-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
        }

        .refresh-btn {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: all 0.15s ease;
        }

        .refresh-btn:disabled { cursor: default; color: var(--text-muted); }

        .hero-weather {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            margin-bottom: 14px;
        }

        .hero-left {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hero-left > div { min-width: 0; overflow-wrap: anywhere; }

        .hero-icon {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .temp-val {
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            border-radius: 4px;
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: baseline;
        }

        .temp-unit {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 2px;
        }

        .desc-row-zh {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px;
        }

        .desc-row-en {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 4px;
            line-height: 1.35;
            display: block;
        }

        .desc-row-en .feels-like {
            display: block;
            margin-top: 2px;
            white-space: nowrap;
        }

        .hero-right {
            flex-shrink: 0;
            margin-left: 8px;
            text-align: right;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* 2x2 指标卡片 */
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .subcard {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        body:not(.tab-blurred) .subcard:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .subcard-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .subcard-label {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .subcard-val {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.2;
            margin-top: 2px;
        }

        /* 4 日预报 */
        .forecast-box {
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .forecast-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            padding: 0 4px;
            margin-bottom: 2px;
            font-weight: 500;
        }

        .forecast-header a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .forecast-header a:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .forecast-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 8px;
            transition: background 0.15s ease;
        }

        .forecast-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .forecast-label {
            min-width: 44px;
            color: var(--text-sub);
            font-weight: 500;
            flex-shrink: 0;
        }

        .forecast-mid {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            padding-left: 14px;
        }

        .forecast-icon {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .forecast-desc {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .forecast-temps {
            flex-shrink: 0;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        /* 实时 a11y 监视器 */
        .a11y-monitor {
            width: 100%;
            max-width: 380px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .a11y-header {
            color: var(--accent);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .a11y-header svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .a11y-content {
            font-family: ui-monospace, monospace;
            color: #cbd5e1;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        .return-link {
            align-self: flex-start;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
        }

        .return-link:hover { color: var(--accent); }

        .global-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .whitespace-nowrap { white-space: nowrap; }

        @media (prefers-reduced-motion: reduce) {
            .toggle-btn, .wmo-card, .weather-btn, .weather-popover,
            .refresh-btn, .subcard, .forecast-row, .forecast-header a,
            input[type="range"]::-webkit-slider-thumb {
                transition: none;
            }
        }

        @media (max-width: 1179px) {
            .workspace {
                grid-template-columns: minmax(280px, 1fr) minmax(340px, 1fr);
                grid-template-areas: "controls preview" "codes preview";
                grid-template-rows: auto auto;
                align-items: start;
                overflow-y: auto;
                overscroll-behavior-y: contain;
                scrollbar-width: thin;
            }
            .panel, .stage { overflow: visible; min-height: auto; }
            .wmo-grid { max-height: 480px; flex: none; }
        }

        @media (max-width: 720px) {
            .workspace { grid-template-columns: 1fr; grid-template-areas: "controls" "preview" "codes"; grid-template-rows: auto auto auto; }
        }

        @media (max-width: 640px) {
            body { padding: 20px 16px; }
            .workspace { gap: 32px; }
            .global-options { grid-template-columns: 1fr; }
            .weather-popover { padding: 14px; }
            .hero-left { gap: 8px; min-width: 0; }
            .hero-icon { width: 36px; height: 36px; }
            .hero-right { flex-shrink: 0; margin-left: 8px; }
            .subcard { padding: 8px; gap: 6px; }
            .forecast-mid { padding-left: 6px; gap: 6px; }
            .forecast-temps { flex-shrink: 0; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        <!-- 控制面板 -->
        <div class="panel">
            <div class="control-group">
                <div class="section-title">
                    <span>全局设置</span>
                </div>
                <div class="global-options">
                    <div class="btn-group">
                        <button type="button" class="toggle-btn active" id="btnDay" onclick="setDayNight(true)">☀️ 白天</button>
                        <button type="button" class="toggle-btn" id="btnNight" onclick="setDayNight(false)">🌙 夜间</button>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="toggle-btn active" id="btnUnitC" onclick="setUnit('C')">摄氏度 °C</button>
                        <button type="button" class="toggle-btn" id="btnUnitF" onclick="setUnit('F')">华氏度 °F</button>
                    </div>
                </div>
                <div class="btn-group" style="margin-top:4px;">
                    <button type="button" class="toggle-btn active" id="btnLangZh" onclick="setLanguage('zh')">中文</button>
                    <button type="button" class="toggle-btn" id="btnLangEn" onclick="setLanguage('en')">English</button>
                </div>
            </div>

            <!-- 动态指标演化 -->
            <div class="control-group">
                <div class="section-title">
                    <span>气象指标</span>
                    <span style="font-size:13px; color:var(--text-muted); text-transform:none;">拖动滑块查看变化</span>
                </div>
                
                <div class="slider-row">
                    <div class="slider-header">
                        <label for="inputHum">相对湿度<small>🌵 &lt;35% · 💧 35~75% · 💦 &gt;75%</small></label>
                        <span class="val" id="valHum">55%</span>
                    </div>
                    <input type="range" id="inputHum" min="0" max="100" value="55" oninput="updateMetrics()">
                </div>

                <div class="slider-row">
                    <div class="slider-header">
                        <label for="inputWind">实时风速<small>🍃 &lt;15 · 🎏 15–&lt;50 · 🌪️ ≥50 km/h</small></label>
                        <span class="val" id="valWind">18 km/h</span>
                    </div>
                    <input type="range" id="inputWind" min="0" max="80" value="18" oninput="updateMetrics()">
                </div>

                <div class="slider-row">
                    <div class="slider-header">
                        <label for="inputPop">降水概率<small>🌂 &lt;30% · ☂️ 30–&lt;70% · ☔️ ≥70%</small></label>
                        <span class="val" id="valPop">20%</span>
                    </div>
                    <input type="range" id="inputPop" min="0" max="100" value="20" oninput="updateMetrics()">
                </div>

                <div class="slider-row">
                    <div class="slider-header">
                        <span>日出日落模式<small>🌇 城市夕阳 · 🌅 海面晨曦</small></span>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="toggle-btn active" id="btnSunset" onclick="setSunMode('sunset')">🌇 今日日落</button>
                        <button type="button" class="toggle-btn" id="btnSunriseTom" onclick="setSunMode('sunriseTomorrow')">🌅 明日日出</button>
                        <button type="button" class="toggle-btn" id="btnSunriseTod" onclick="setSunMode('sunriseToday')">🌅 今日日出</button>
                    </div>
                </div>
            </div>
            <a class="return-link" href="../dist/index.html">← 返回起始页</a>
        </div>

        <!-- 29 种 WMO 状态切换 -->
        <div class="control-group codes-panel">
            <div class="section-title">
                <span>天气状态</span>
                <span style="font-size:13px; color:var(--text-muted);" id="currentWmoLabel">当前: Code 1</span>
            </div>
            <p class="section-note">选择状态，即时查看图标与天气描述。</p>
            <div class="wmo-grid" id="wmoGrid">
                <!-- 由 JS 动态渲染全部 29 种状态按钮 -->
            </div>
        </div>

        <!-- 预览区 -->
        <div class="stage">
            <!-- 胶囊预览 -->
            <div class="capsule-wrapper">
                <div class="capsule-label">实时预览</div>
                <button type="button" class="weather-btn" id="previewCapsule" aria-controls="previewPopover" onclick="document.getElementById('previewPopover').focus()">
                    <img id="capsuleIcon" src="../public/icons/emoji/sun_behind_small_cloud.svg" style="width:16px; height:16px;" alt="">
                    <span id="capsuleTemp" style="font-weight:600;">22°</span>
                    <span style="opacity:0.3;">·</span>
                    <span id="capsuleCity">本地</span>
                </button>
            </div>

            <!-- 固定样例天气详情 -->
            <div class="weather-popover" id="previewPopover" tabindex="-1" role="region" aria-label="天气详情预览">
                <div class="popover-header">
                    <div class="location-tag">
                        <img src="../public/icons/emoji/round_pushpin.svg" style="width:14px; height:14px;" alt="">
                        <span id="popoverLocationText">本地</span>
                    </div>
                    <button type="button" class="refresh-btn" disabled title="静态预览，不请求实时天气" aria-label="刷新天气（静态预览，不可用）">
                        <svg aria-hidden="true" style="width:14px; height:14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                    </button>
                </div>

                <div class="hero-weather">
                    <div class="hero-left">
                        <img id="popoverHeroIcon" class="hero-icon" src="../public/icons/emoji/sun_behind_small_cloud.svg" alt="">
                        <div>
                            <button type="button" class="temp-val" onclick="toggleUnit()" aria-label="切换温度单位"><span id="popoverTemp">22</span><span class="temp-unit" id="popoverUnit">°C</span></button>
                            <div id="popoverDescContainer" class="desc-row-zh">
                                <span id="popoverDesc">少云</span>
                                <span style="opacity:0.4;" aria-hidden="true">·</span>
                                <span class="whitespace-nowrap">体感 <span id="popoverApparent">21</span>°</span>
                            </div>
                        </div>
                    </div>
                    <div class="hero-right" id="heroRight">
                        <div>最高 <span id="popoverHigh">24</span>°</div>
                        <div style="margin-top:2px;">最低 <span id="popoverLow">16</span>°</div>
                    </div>
                </div>

                <!-- 2x2 指标 -->
                <div class="metric-grid">
                    <div class="subcard">
                        <img id="iconHum" class="subcard-icon" src="../public/icons/emoji/droplet.svg" alt="">
                        <div>
                            <div class="subcard-label" id="labelHum">相对湿度</div>
                            <div class="subcard-val" id="textHum">55%</div>
                        </div>
                    </div>
                    <div class="subcard">
                        <img id="iconWind" class="subcard-icon" src="../public/icons/emoji/carp_streamer.svg" alt="">
                        <div>
                            <div class="subcard-label" id="labelWind">实时风速</div>
                            <div class="subcard-val" id="textWind">18 km/h</div>
                        </div>
                    </div>
                    <div class="subcard">
                        <img id="iconPop" class="subcard-icon" src="../public/icons/emoji/closed_umbrella.svg" alt="">
                        <div>
                            <div class="subcard-label" id="labelPop">降水概率</div>
                            <div class="subcard-val" id="textPop">20%</div>
                        </div>
                    </div>
                    <div class="subcard">
                        <img id="iconSun" class="subcard-icon" src="../public/icons/emoji/sunset.svg" alt="">
                        <div>
                            <div class="subcard-label" id="labelSun">今日日落</div>
                            <div class="subcard-val" id="textSun">18:24</div>
                        </div>
                    </div>
                </div>

                <!-- 预报列表 -->
                <div class="forecast-box">
                    <div class="forecast-header">
                        <span id="forecastHeaderTitle">未来预报</span>
                        <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>
                    </div>
                    <div class="forecast-row">
                        <span class="forecast-label" id="forecastDay0">今天</span>
                        <div class="forecast-mid">
                            <img id="forecastIcon0" class="forecast-icon" src="../public/icons/emoji/sun_behind_small_cloud.svg" alt="">
                            <span class="forecast-desc" id="forecastDesc0">少云</span>
                        </div>
                        <span class="forecast-temps" id="forecastTemps0">16° ~ 24°</span>
                    </div>
                    <div class="forecast-row">
                        <span class="forecast-label" id="forecastDay1">明天</span>
                        <div class="forecast-mid">
                            <img id="forecastIcon1" class="forecast-icon" src="../public/icons/emoji/sun.svg" alt="">
                            <span class="forecast-desc" id="forecastDesc1">晴</span>
                        </div>
                        <span class="forecast-temps" id="forecastTemps1">10° ~ 19°</span>
                    </div>
                    <div class="forecast-row">
                        <span class="forecast-label" id="forecastDay2">后天</span>
                        <div class="forecast-mid">
                            <img id="forecastIcon2" class="forecast-icon" src="../public/icons/emoji/cloud.svg" alt="">
                            <span class="forecast-desc" id="forecastDesc2">阴</span>
                        </div>
                        <span class="forecast-temps" id="forecastTemps2">9° ~ 16°</span>
                    </div>
                    <div class="forecast-row">
                        <span class="forecast-label" id="forecastDay3">周一</span>
                        <div class="forecast-mid">
                            <img id="forecastIcon3" class="forecast-icon" src="../public/icons/emoji/cloud_with_rain.svg" alt="">
                            <span class="forecast-desc" id="forecastDesc3">小雨</span>
                        </div>
                        <span class="forecast-temps" id="forecastTemps3">8° ~ 11°</span>
                    </div>
                </div>
            </div>

            <!-- 无障碍朗读监听面板 -->
            <div class="a11y-monitor">
                <div class="a11y-header">
                    <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <rect x="9" y="2" width="6" height="12" rx="3"/>
                        <path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v4M9 22h6"/>
                    </svg>
                    <span>屏幕阅读器 · 朗读文本</span>
                </div>
                <div class="a11y-content" id="a11yOutput">--</div>
                <p class="section-note">胶囊按钮的无障碍标签预览，不会录音或播放语音。</p>
            </div>
        </div>
    </div>

    <script>
        // ==================== 数据字典与模型 ====================
        const WMO_DATA = {
            0:  { zh: '晴', en: 'Clear', day: 'sun.svg', night: 'crescent_moon.svg' },
            1:  { zh: '少云', en: 'Mostly clear', day: 'sun_behind_small_cloud.svg', night: 'crescent_moon.svg' },
            2:  { zh: '多云', en: 'Partly cloudy', day: 'sun_behind_cloud.svg', night: 'cloud.svg' },
            3:  { zh: '阴', en: 'Overcast', day: 'cloud.svg', night: 'cloud.svg' },
            45: { zh: '雾', en: 'Fog', day: 'fog.svg', night: 'fog.svg' },
            48: { zh: '冻雾', en: 'Rime fog', day: 'fog.svg', night: 'fog.svg' },
            51: { zh: '小毛毛雨', en: 'Light drizzle', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            53: { zh: '中毛毛雨', en: 'Drizzle', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            55: { zh: '强毛毛雨', en: 'Heavy drizzle', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            56: { zh: '小冻毛毛雨', en: 'Light freezing drizzle', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            57: { zh: '强冻毛毛雨', en: 'Heavy freezing drizzle', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            61: { zh: '小雨', en: 'Light rain', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            63: { zh: '中雨', en: 'Rain', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            65: { zh: '大雨', en: 'Heavy rain', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            66: { zh: '小冻雨', en: 'Light freezing rain', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            67: { zh: '强冻雨', en: 'Heavy freezing rain', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            71: { zh: '小雪', en: 'Light snow', day: 'cloud_with_snow.svg', night: 'cloud_with_snow.svg' },
            73: { zh: '中雪', en: 'Snow', day: 'cloud_with_snow.svg', night: 'cloud_with_snow.svg' },
            75: { zh: '大雪', en: 'Heavy snow', day: 'cloud_with_snow.svg', night: 'cloud_with_snow.svg' },
            77: { zh: '雪粒', en: 'Snow grains', day: 'cloud_with_snow.svg', night: 'cloud_with_snow.svg' },
            80: { zh: '小阵雨', en: 'Light showers', day: 'sun_behind_rain_cloud.svg', night: 'cloud_with_rain.svg' },
            81: { zh: '中阵雨', en: 'Rain showers', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            82: { zh: '强阵雨', en: 'Heavy showers', day: 'cloud_with_rain.svg', night: 'cloud_with_rain.svg' },
            85: { zh: '小阵雪', en: 'Snow showers', day: 'cloud_with_snow.svg', night: 'cloud_with_snow.svg' },
            86: { zh: '大阵雪', en: 'Heavy snow showers', day: 'cloud_with_snow.svg', night: 'cloud_with_snow.svg' },
            95: { zh: '雷暴', en: 'Thunderstorm', day: 'cloud_with_lightning_rain.svg', night: 'cloud_with_lightning_rain.svg' },
            96: { zh: '雷暴伴小冰雹', en: 'Thunderstorm with slight hail', day: 'cloud_with_lightning_rain.svg', night: 'cloud_with_lightning_rain.svg' },
            97: { zh: '强雷暴', en: 'Heavy thunderstorm', day: 'cloud_with_lightning_rain.svg', night: 'cloud_with_lightning_rain.svg' },
            99: { zh: '雷暴伴大冰雹', en: 'Thunderstorm with heavy hail', day: 'cloud_with_lightning_rain.svg', night: 'cloud_with_lightning_rain.svg' }
        };

        // 当前实验室状态
        const state = {
            code: 1,
            isDay: true,
            unit: 'C',
            lang: 'zh',
            humidity: 55,
            windSpeed: 18,
            pop: 20,
            sunMode: 'sunset', // 'sunset' | 'sunriseTomorrow' | 'sunriseToday'
            tempC: 22,
            apparentC: 21
        };

        // ==================== 渲染控制网格 ====================
        function initWmoGrid() {
            const grid = document.getElementById('wmoGrid');
            grid.innerHTML = '';
            for (const [codeStr, info] of Object.entries(WMO_DATA)) {
                const code = Number(codeStr);
                const card = document.createElement('button');
                card.type = 'button';
                card.className = `wmo-card ${code === state.code ? 'active' : ''}`;
                card.id = `wmo-card-${code}`;
                card.onclick = () => selectWmo(code);
                
                const iconFile = state.isDay ? info.day : info.night;
                card.innerHTML = `
                    <img src="../public/icons/emoji/${iconFile}" alt="">
                    <span>${code} ${state.lang === 'zh' ? info.zh : info.en}</span>
                `;
                grid.appendChild(card);
            }
        }

        function selectWmo(code) {
            state.code = code;
            document.querySelectorAll('.wmo-card').forEach(el => el.classList.remove('active'));
            const activeCard = document.getElementById(`wmo-card-${code}`);
            if (activeCard) activeCard.classList.add('active');
            renderAll();
        }

        // ==================== 状态切换方法 ====================
        function setDayNight(isDay) {
            state.isDay = isDay;
            document.getElementById('btnDay').classList.toggle('active', isDay);
            document.getElementById('btnNight').classList.toggle('active', !isDay);
            initWmoGrid();
            renderAll();
        }

        function setUnit(unit) {
            state.unit = unit;
            document.getElementById('btnUnitC').classList.toggle('active', unit === 'C');
            document.getElementById('btnUnitF').classList.toggle('active', unit === 'F');
            renderAll();
        }

        function toggleUnit() {
            setUnit(state.unit === 'C' ? 'F' : 'C');
        }

        function setLanguage(lang) {
            state.lang = lang;
            document.getElementById('btnLangZh').classList.toggle('active', lang === 'zh');
            document.getElementById('btnLangEn').classList.toggle('active', lang === 'en');
            initWmoGrid();
            renderAll();
        }

        function setSunMode(mode) {
            state.sunMode = mode;
            document.getElementById('btnSunset').classList.toggle('active', mode === 'sunset');
            document.getElementById('btnSunriseTom').classList.toggle('active', mode === 'sunriseTomorrow');
            document.getElementById('btnSunriseTod').classList.toggle('active', mode === 'sunriseToday');
            renderAll();
        }

        function updateMetrics() {
            state.humidity = Number(document.getElementById('inputHum').value);
            state.windSpeed = Number(document.getElementById('inputWind').value);
            state.pop = Number(document.getElementById('inputPop').value);

            document.getElementById('valHum').textContent = state.humidity + '%';
            document.getElementById('valWind').textContent = state.windSpeed + ' km/h';
            document.getElementById('valPop').textContent = state.pop + '%';

            renderAll();
        }

        // ==================== 组件渲染与联动 ====================
        function toDisplayTemp(celsius, unit) {
            if (unit === 'F') {
                return Math.round(celsius * 9 / 5 + 32);
            }
            return Math.round(celsius);
        }

        function renderAll() {
            document.querySelectorAll('.toggle-btn, .wmo-card').forEach(button => {
                button.setAttribute('aria-pressed', String(button.classList.contains('active')));
            });
            for (const id of ['previewCapsule', 'previewPopover', 'a11yOutput', 'wmoGrid']) {
                document.getElementById(id).lang = state.lang === 'zh' ? 'zh-CN' : 'en';
            }
            const refresh = document.querySelector('.refresh-btn');
            refresh.title = state.lang === 'zh' ? '静态预览，不请求实时天气' : 'Static preview; no live weather requests';
            refresh.setAttribute('aria-label', refresh.title);
            document.querySelector('.temp-val').setAttribute('aria-label', state.lang === 'zh' ? '切换温度单位' : 'Switch temperature unit');
            document.getElementById('previewPopover').setAttribute('aria-label', state.lang === 'zh' ? '天气详情预览' : 'Weather details preview');
            const wmo = WMO_DATA[state.code] || WMO_DATA[0];
            const iconFile = state.isDay ? wmo.day : wmo.night;
            const desc = state.lang === 'zh' ? wmo.zh : wmo.en;
            const temp = toDisplayTemp(state.tempC, state.unit);
            const apparent = toDisplayTemp(state.apparentC, state.unit);

            // 1. 胶囊与位置渲染
            const capsuleIcon = document.getElementById('capsuleIcon');
            capsuleIcon.src = `../public/icons/emoji/${iconFile}`;
            document.getElementById('capsuleTemp').textContent = `${temp}°`;
            document.getElementById('capsuleCity').textContent = state.lang === 'zh' ? '本地' : 'Local area';
            document.getElementById('popoverLocationText').textContent = state.lang === 'zh' ? '本地' : 'Local area';

            // 预览与正式组件相同格式的胶囊无障碍标签
            let ariaLabel = '';
            if (state.lang === 'zh') {
                ariaLabel = `${temp}°·本地 实时天气${desc}，点击查看详细预报`;
            } else {
                ariaLabel = `Local area: ${temp}°, ${desc}. Open detailed forecast`;
            }
            document.getElementById('previewCapsule').setAttribute('aria-label', ariaLabel);
            document.getElementById('a11yOutput').textContent = ariaLabel;

            // 2. 弹窗 Hero 渲染
            document.getElementById('popoverHeroIcon').src = `../public/icons/emoji/${iconFile}`;
            document.getElementById('popoverTemp').textContent = temp;
            document.getElementById('popoverUnit').textContent = `°${state.unit}`;

            // Hero 状态描述与体感排版（英文另起一行，中文单行带间隔点）
            const descContainer = document.getElementById('popoverDescContainer');
            if (state.lang === 'zh') {
                descContainer.className = 'desc-row-zh';
                descContainer.innerHTML = `<span>${desc}</span><span style="opacity:0.4;" aria-hidden="true">·</span><span class="whitespace-nowrap">体感 ${apparent}°</span>`;
            } else {
                descContainer.className = 'desc-row-en';
                descContainer.innerHTML = `<span>${desc}</span><span class="feels-like">Feels like ${apparent}°</span>`;
            }

            const maxTemp = toDisplayTemp(23, state.unit);
            const minTemp = toDisplayTemp(14, state.unit);
            document.getElementById('heroRight').innerHTML = state.lang === 'zh'
                ? `<div>最高 ${maxTemp}°</div><div style="margin-top:2px;">最低 ${minTemp}°</div>`
                : `<div>High ${maxTemp}°</div><div style="margin-top:2px;">Low ${minTemp}°</div>`;

            document.getElementById('currentWmoLabel').textContent = `当前: Code ${state.code} (${desc})`;

            // 3. 2×2 指标动态演化判定
            // 湿度
            let humIcon = 'droplet.svg';
            if (state.humidity < 35) humIcon = 'cactus.svg';
            else if (state.humidity > 75) humIcon = 'sweat_drops.svg';
            document.getElementById('iconHum').src = `../public/icons/emoji/${humIcon}`;
            document.getElementById('labelHum').textContent = state.lang === 'zh' ? '相对湿度' : 'Humidity';
            document.getElementById('textHum').textContent = state.humidity + '%';

            // 风速 (WIND_HIGH_THRESHOLD: 50 km/h)
            let windIcon = 'leaf_fluttering.svg';
            if (state.windSpeed >= 50) windIcon = 'tornado.svg';
            else if (state.windSpeed >= 15) windIcon = 'carp_streamer.svg';
            document.getElementById('iconWind').src = `../public/icons/emoji/${windIcon}`;
            document.getElementById('labelWind').textContent = state.lang === 'zh' ? '实时风速' : 'Wind speed';
            document.getElementById('textWind').textContent = state.windSpeed + ' km/h';

            // 降水概率
            let popIcon = 'closed_umbrella.svg';
            if (state.pop >= 70) popIcon = 'umbrella_rain_drops.svg';
            else if (state.pop >= 30) popIcon = 'umbrella.svg';
            document.getElementById('iconPop').src = `../public/icons/emoji/${popIcon}`;
            document.getElementById('labelPop').textContent = state.lang === 'zh' ? '降水概率' : 'Rain chance';
            document.getElementById('textPop').textContent = state.pop + '%';

            // 日出日落
            let sunIcon = 'sunset.svg';
            let sunLabel = state.lang === 'zh' ? '今日日落' : 'Sunset today';
            let sunTime = '18:24';
            if (state.sunMode === 'sunriseTomorrow') {
                sunIcon = 'sunrise.svg';
                sunLabel = state.lang === 'zh' ? '明日日出' : 'Sunrise tomorrow';
                sunTime = '06:12';
            } else if (state.sunMode === 'sunriseToday') {
                sunIcon = 'sunrise.svg';
                sunLabel = state.lang === 'zh' ? '今日日出' : 'Sunrise today';
                sunTime = '06:07';
            }
            document.getElementById('iconSun').src = `../public/icons/emoji/${sunIcon}`;
            document.getElementById('labelSun').textContent = sunLabel;
            document.getElementById('textSun').textContent = sunTime;

            // 4. 预报列表多语言与联动
            document.getElementById('forecastHeaderTitle').textContent = state.lang === 'zh' ? '未来预报' : 'Upcoming forecast';

            const forecasts = [
                {
                    dayZh: '今天',
                    dayEn: 'Today',
                    icon: wmo.day,
                    descZh: desc,
                    descEn: desc,
                    min: minTemp,
                    max: maxTemp
                },
                {
                    dayZh: '明天',
                    dayEn: 'Tomorrow',
                    icon: 'sun.svg',
                    descZh: '晴',
                    descEn: 'Clear',
                    min: toDisplayTemp(10, state.unit),
                    max: toDisplayTemp(19, state.unit)
                },
                {
                    dayZh: '周日',
                    dayEn: 'Sun',
                    icon: 'cloud.svg',
                    descZh: '阴',
                    descEn: 'Overcast',
                    min: toDisplayTemp(9, state.unit),
                    max: toDisplayTemp(16, state.unit)
                },
                {
                    dayZh: '周一',
                    dayEn: 'Mon',
                    icon: 'cloud_with_rain.svg',
                    descZh: '小雨',
                    descEn: 'Light rain',
                    min: toDisplayTemp(8, state.unit),
                    max: toDisplayTemp(11, state.unit)
                }
            ];

            forecasts.forEach((f, idx) => {
                const dayEl = document.getElementById(`forecastDay${idx}`);
                const iconEl = document.getElementById(`forecastIcon${idx}`);
                const descEl = document.getElementById(`forecastDesc${idx}`);
                const tempsEl = document.getElementById(`forecastTemps${idx}`);
                if (dayEl) dayEl.textContent = state.lang === 'zh' ? f.dayZh : f.dayEn;
                if (iconEl) iconEl.src = `../public/icons/emoji/${f.icon}`;
                if (descEl) descEl.textContent = state.lang === 'zh' ? f.descZh : f.descEn;
                if (tempsEl) tempsEl.textContent = `${f.min}° ~ ${f.max}°`;
            });
        }

        // 初始化
        initWmoGrid();
        renderAll();
    </script>
</body>
</html>
